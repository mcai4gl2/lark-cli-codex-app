# Lark Calendar CLI Configuration
# Copy this to .lark/config.yaml and fill in your values

# Lark/Feishu App credentials (from the Developer Console)
app_id: "cli_xxxxxxxxxx"
# app_secret should be set via LARK_APP_SECRET environment variable

# API/auth region: lark (default) or feishu
region: "lark"

# Default settings
defaults:
  timezone: "Asia/Singapore"
  reminder_minutes: 15

# OAuth settings
oauth:
  redirect_port: 9999

# Optional local task agent powered by a local coding backend.
agent:
  enabled: false
  # Agent backend: codex, agy, or grok. Defaults to codex.
  # Overridable per thread via a leading /codex, /agy, or /grok message prefix.
  backend: "codex"
  # Backend binary path or command name. Empty uses backend default.
  binary: ""
  # Extra backend-specific CLI args appended to the generated command.
  args: []
  # Deprecated compatibility alias for older Codex-only configs. Prefer binary.
  codex_binary: "codex"
  # Grok CLI binary path or command name (used when backend is grok or /grok pin).
  grok_binary: "grok"
  workspace: "~/WorkSpace"
  model: ""
  ack_text: "收到，开始处理。"
  result_max_chars: 1800
  timeout_minutes: 20

# Local gateway settings for WebSocket long connections (recommended)
gateway:
  # JSONL file that stores received message events
  event_log: ".lark/gateway-events.jsonl"
  # Optional plain-text auto-reply template
  # Supported placeholders: {{text}}, {{chat_id}}, {{message_id}}, {{sender_open_id}}
  auto_reply_text: ""

# Slack Socket Mode settings (optional)
# Prefer setting secrets via SLACK_BOT_TOKEN and SLACK_APP_TOKEN.
slack:
  bot_token: ""
  app_token: ""
  signing_secret: ""
  bot_user_id: ""
  gateway:
    # JSONL file that stores received Slack message events
    event_log: ".slack/gateway-events.jsonl"
    # Slack catch-up mode: thread, mention-dm, or off
    recover_mode: "thread"
    # Emoji reaction used while processing Slack messages; empty disables reactions
    processing_reaction: "eyes"
    # Optional plain-text auto-reply template
    # Supported placeholders: {{text}}, {{channel_id}}, {{thread_id}}, {{message_id}}, {{user_id}}
    auto_reply_text: ""
  memory:
    enabled: false
    # Root directory for channel/thread audit logs and memory markdown files.
    root: ".slack/conversations"
    # Maximum characters loaded from each memory file into agent prompts.
    max_section_chars: 2000
    # Include recent thread conversation records in agent prompts.
    include_thread_transcript: true
    # Maximum characters loaded from recent thread transcript records.
    max_transcript_chars: 8000
    # Maximum recent thread records loaded into agent prompts.
    max_transcript_records: 30
  local_summarizer:
    # Enable summarization of long outbound (LLM reply) records in thread transcripts.
    # Requires a running local-summarizer service (Gemma 3 1B via llama.cpp).
    enabled: false
    # Base URL of the local summarizer gateway.
    url: "http://localhost:8080"
    # Maximum tokens for each summary response (kept small for a 1B model).
    max_tokens: 128
    # HTTP timeout for each summarization call in seconds.
    timeout_seconds: 30
    # Only summarize outbound records longer than this many characters.
    # Short replies are passed through unchanged.
    min_chars: 300
  agent:
    enabled: false
    # Agent backend: codex, agy, or grok. Defaults to codex.
    # Overridable per thread via a leading /codex, /agy, or /grok message prefix.
    backend: "codex"
    # Backend binary path or command name. Empty uses backend default.
    binary: ""
    # Extra backend-specific CLI args appended to the generated command.
    args: []
    # Deprecated compatibility alias for older Codex-only configs. Prefer binary.
    codex_binary: "codex"
    # Grok CLI binary path or command name (used when backend is grok or /grok pin).
    grok_binary: "grok"
    workspace: "~/WorkSpace"
    model: ""
    ack_text: "Received. Working on it."
    result_max_chars: 3500
    timeout_minutes: 20
    # Resume Codex sessions across Slack thread messages instead of starting fresh.
    # Requires memory to be enabled (for the .state directory).
    session_resume: false

# Webhook settings for Feishu/Lark event subscriptions (optional)
webhook:
  # Local listen address for `lark webhook serve`
  listen_addr: "0.0.0.0:8080"
  # Callback path configured in the Feishu/Lark app console
  path: "/webhook/feishu"
  # Optional verification token configured in the Feishu/Lark app console
  verification_token: ""
  # JSONL file that stores received message events
  event_log: ".lark/webhook-events.jsonl"
  # Optional plain-text auto-reply template
  # Supported placeholders: {{text}}, {{chat_id}}, {{message_id}}, {{sender_open_id}}
  auto_reply_text: ""

# Custom emoji mappings (optional)
# Map custom emoji IDs to human-readable labels for reactions
# Find custom emoji IDs via: lark msg react emojis
# custom_emojis:
#   "7405453485858095136": "ez-pepe"
#   "7405453485858111520": "pepe-laugh"
